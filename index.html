<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    document.documentElement.innerHTML = '';
    var placeId = "ChIJAeAs-z3P1EARD1f6SxZa5yI";
    var reviewUrl = "https://search.google.com/local/writereview?placeid=" + placeId;
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    if (isAndroid) {
      location.href =
        "intent://search.google.com/local/writereview?placeid=" + placeId +
        "#Intent;scheme=https;package=com.android.chrome;" +
        "S.browser_fallback_url=" + encodeURIComponent(reviewUrl) +
        ";end";
    } else if (isIOS) {
      location.href = "googlechrome://navigate?url=" + encodeURIComponent(reviewUrl);
    } else {
      location.href = reviewUrl;
    }
  </script>
</head>
<body></body>
</html>
