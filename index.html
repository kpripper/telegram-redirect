<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Перенаправлення...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <p>Перенаправлення в Google Maps...</p>

  <script>
    var cid = "2515077968720189199";
    var placeId = "ChIJAeAs-z3P1EARD1f6SxZa5yI";
    var reviewUrl = "https://search.google.com/local/writereview?placeid=" + placeId;
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);

    if (isAndroid) {
      var fallback = encodeURIComponent(reviewUrl);
      window.location.replace(
        "intent://maps.google.com/maps?cid=" + cid +
        "#Intent;scheme=https;package=com.google.android.apps.maps;" +
        "S.browser_fallback_url=" + fallback +
        ";end"
      );
    } else if (isIOS) {
      window.location.replace("comgooglemaps://maps.google.com/maps?cid=" + cid);
    } else {
      window.location.replace(reviewUrl);
    }
  </script>
</body>
</html>
